<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0d10;color:#eef0f3;font-family:Inter,sans-serif}
.page{width:1000px;padding:36px 36px 44px;box-sizing:border-box}
h1{margin:0 0 4px;font-size:34px;font-weight:900;color:#e8c170}
.sub{margin:0 0 30px;color:#8d95a3;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.c{background:#151920;border:1px solid #2a303a;border-radius:22px;padding:18px;display:grid;gap:12px;justify-items:center}
.big{width:200px;height:200px;border-radius:45px;overflow:hidden;box-shadow:0 14px 30px -10px rgba(0,0,0,.8)}
.big svg,.sm svg{width:100%;height:100%;display:block}
.name{font-weight:800;font-size:19px;text-align:center}
.why{color:#9aa2af;font-size:13.5px;line-height:1.4;text-align:center;min-height:56px}
.home{display:flex;gap:10px;align-items:flex-start;justify-content:center;background:linear-gradient(160deg,#3b4a6b,#1b2236);border-radius:16px;padding:12px 10px 8px;width:100%;box-sizing:border-box}
.app{display:grid;justify-items:center;gap:4px;width:56px}
.sm{width:52px;height:52px;border-radius:12px;overflow:hidden}
.app span{font-size:9.5px;color:#fff;white-space:nowrap}
.ph{width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,.18)}
.tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:#1a1408;background:#e8c170;border-radius:6px;padding:2px 7px}
</style></head><body><div class="page">
<h1>Spot-a-Crop · icon ideas, round 2</h1>
<p class="sub">Mixing the spy glass, Kernel, and the map pin. All original artwork.</p>
<div class="grid" id="grid"></div>
</div>
<script>
// Shared pieces (100×100 artboards).
const patch = (rot = -12) => `<g transform="rotate(${rot} 50 50)">
  <rect x="-10" y="-10" width="40" height="34" fill="#ffc928"/><rect x="30" y="-10" width="34" height="34" fill="#3fae5c"/><rect x="64" y="-10" width="46" height="34" fill="#a78bfa"/>
  <rect x="-10" y="24" width="28" height="38" fill="#3fae5c"/><rect x="18" y="24" width="44" height="38" fill="#fb7a24"/><rect x="62" y="24" width="48" height="38" fill="#ffc928"/>
  <rect x="-10" y="62" width="46" height="48" fill="#ffc928"/><rect x="36" y="62" width="30" height="48" fill="#38bdf8"/><rect x="66" y="62" width="44" height="48" fill="#3fae5c"/>
  <path d="M-10 24 H110 M-10 62 H110 M30 -10 V24 M64 -10 V24 M18 24 V62 M62 24 V62 M36 62 V110 M66 62 V110" stroke="#151a22" stroke-width="3"/></g>`;
const sprout = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">
  <path d="M0 9 V0" stroke="#2f8f4e" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M0 2 C-6 1 -8 -5 -7 -9 C-2 -8 0 -4 0 2Z" fill="#3fae5c"/><path d="M0 0 C6 -2 8 -7 7 -11 C2 -10 0 -6 0 0Z" fill="#46c776"/></g>`;
const kernelFace = (cx, cy, s = 1, bino = false) => `<g transform="translate(${cx} ${cy}) scale(${s})">
  <path d="M-28 14 C-36 2 -32 -14 -24 -20 C-24 -6 -18 6 -8 14 Z" fill="#3fbf6a"/>
  <path d="M28 14 C36 2 32 -14 24 -20 C24 -6 18 6 8 14 Z" fill="#2ea85a"/>
  <ellipse cx="0" cy="0" rx="17" ry="26" fill="#ffc928"/>
  <g fill="#ffdd6b"><circle cx="-7" cy="-15" r="3"/><circle cx="0" cy="-18" r="3"/><circle cx="7" cy="-15" r="3"/><circle cx="-8" cy="14" r="3"/><circle cx="8" cy="14" r="3"/></g>
  ${bino ? '' : '<circle cx="-6" cy="-2" r="3.4" fill="#1a1408"/><circle cx="6" cy="-2" r="3.4" fill="#1a1408"/><circle cx="-5" cy="-3.2" r="1.1" fill="#fff"/><circle cx="7" cy="-3.2" r="1.1" fill="#fff"/>'}
  <path d="M-6 8 Q0 13 6 8" stroke="#1a1408" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M-28 14 C-22 26 -10 32 0 32 C10 32 22 26 28 14 C18 20 8 22 0 22 C-8 22 -18 20 -28 14Z" fill="#46c776"/></g>`;

// 1. Pin with a lens head
const P1 = `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#151a22"/>${patch()}
  <path d="M50 88 C50 88 28 62 28 44 A22 22 0 1 1 72 44 C72 62 50 88 50 88Z" fill="#151a22" opacity=".35" transform="translate(2 3)"/>
  <path d="M50 86 C50 86 29 61 29 44 A21 21 0 1 1 71 44 C71 61 50 86 50 86Z" fill="#e8c170"/>
  <circle cx="50" cy="44" r="13.5" fill="#cfeedd"/>${sprout(50, 46, 1.25)}
  <circle cx="50" cy="44" r="13.5" fill="none" stroke="#c99a3e" stroke-width="2.5"/>
  <path d="M42 36 A11 11 0 0 1 52 33" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".8"/>
</svg>`;
// 2. Kernel inside a pin
const P2 = `<svg viewBox="0 0 100 100"><defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24324a"/><stop offset="1" stop-color="#121826"/></linearGradient>
  <clipPath id="pin2"><path d="M50 90 C50 90 24 62 24 42 A26 26 0 1 1 76 42 C76 62 50 90 50 90Z"/></clipPath></defs>
  <rect width="100" height="100" fill="url(#g2)"/>
  <path d="M0 82 Q50 74 100 82 L100 100 L0 100Z" fill="#2f8f4e"/>
  <path d="M50 92 C50 92 22 63 22 42 A28 28 0 1 1 78 42 C78 63 50 92 50 92Z" fill="#e8c170"/>
  <g clip-path="url(#pin2)"><rect width="100" height="100" fill="#3a2f12"/><rect y="56" width="100" height="44" fill="#ffc928"/>${kernelFace(50, 46, 0.78)}</g>
</svg>`;
// 3. Spy glass over the patchwork, top-down
const P3 = `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#151a22"/>${patch(8)}
  <rect width="100" height="100" fill="#0d1016" opacity=".25"/>
  <circle cx="44" cy="44" r="24" fill="#0d1016" opacity=".35" transform="translate(2 3)"/>
  <clipPath id="l3"><circle cx="44" cy="44" r="21"/></clipPath>
  <g clip-path="url(#l3)"><g transform="translate(44 44) scale(1.6) translate(-44 -44)">${patch(8)}</g>${sprout(44, 48, 1.6)}</g>
  <circle cx="44" cy="44" r="21" fill="none" stroke="#e8c170" stroke-width="6"/>
  <path d="M60 60 L80 80" stroke="#e8c170" stroke-width="10" stroke-linecap="round"/><path d="M60 60 L80 80" stroke="#c99a3e" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 34 A15 15 0 0 1 44 28" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
</svg>`;
// 4. Kernel with a spy glass
const P4 = `<svg viewBox="0 0 100 100"><defs><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a5a"/><stop offset="1" stop-color="#141b2a"/></linearGradient></defs>
  <rect width="100" height="100" fill="url(#g4)"/><circle cx="82" cy="18" r="7" fill="#ffd36b" opacity=".9"/>
  <path d="M0 78 Q50 70 100 78 L100 100 L0 100Z" fill="#2f8f4e"/>
  ${kernelFace(42, 50, 0.95)}
  <circle cx="62" cy="50" r="12" fill="#cfeedd" opacity=".55"/><circle cx="62" cy="50" r="12" fill="none" stroke="#e8c170" stroke-width="4"/>
  <path d="M71 59 L82 70" stroke="#e8c170" stroke-width="6" stroke-linecap="round"/>
  <circle cx="58" cy="47" r="3.6" fill="#1a1408"/><circle cx="59.2" cy="45.8" r="1.2" fill="#fff"/>
</svg>`;
// 5. Seed-shaped pin sprouting, sunset rows
const P5 = `<svg viewBox="0 0 100 100"><defs><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb45c"/><stop offset=".55" stop-color="#ff8a4c"/><stop offset="1" stop-color="#3f2a4a"/></linearGradient></defs>
  <rect width="100" height="100" fill="url(#g5)"/><circle cx="50" cy="60" r="20" fill="#ffe08a" opacity=".85"/>
  <path d="M0 64 L100 64 L100 100 L0 100Z" fill="#2f6e3e"/>
  ${[0,1,2,3,4,5,6].map(i => `<path d="M50 64 L${-40 + i * 30} 100" stroke="#3f8f50" stroke-width="5"/>`).join('')}
  <path d="M50 74 C50 74 36 56 36 45 A14 14 0 1 1 64 45 C64 56 50 74 50 74Z" fill="#fff4dc" stroke="#c99a3e" stroke-width="2.5"/>
  ${sprout(50, 46, 1.4)}
</svg>`;

const ideas = [
  ['1', 'Lens Pin', P1, 'D’s map pin, but the pin head is a spy glass with a sprout inside. Map + spotting in one shape.', 'my pick'],
  ['2', 'Kernel Pin', P2, 'Kernel peeking out of a map pin. Mascot + map, very ownable.', ''],
  ['3', 'Spy Glass Map', P3, 'A’s spy glass over D’s colorful fields, zooming in on a sprout.', ''],
  ['4', 'Kernel Spotter', P4, 'Kernel holding a spy glass. The friendliest, most character-driven.', ''],
  ['5', 'Sunset Pin', P5, 'A seed-shaped pin sprouting over crop rows at sunset. Warm and calm.', ''],
];
document.getElementById('grid').innerHTML = ideas.map(([k, name, svg, why, tag]) => `<div class="c">
  <div class="big">${svg}</div>
  <div class="name">${k}. ${name}</div>${tag ? `<span class="tag">${tag.toUpperCase()}</span>` : '<span style="height:19px"></span>'}
  <div class="why">${why}</div>
  <div class="home"><div class="app"><div class="ph"></div><span>Maps</span></div><div class="app"><div class="sm">${svg}</div><span>Spot-a-Crop</span></div><div class="app"><div class="ph"></div><span>Weather</span></div></div>
</div>`).join('');
</script></body></html>

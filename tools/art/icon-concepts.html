<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0d10;color:#eef0f3;font-family:Inter,sans-serif}
.page{width:1000px;padding:36px 36px 44px;box-sizing:border-box}
h1{margin:0 0 4px;font-size:34px;font-weight:900;color:#e8c170}
.sub{margin:0 0 30px;color:#8d95a3;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.c{background:#151920;border:1px solid #2a303a;border-radius:22px;padding:18px;display:grid;gap:12px;justify-items:center}
.big{width:200px;height:200px;border-radius:45px;overflow:hidden;box-shadow:0 14px 30px -10px rgba(0,0,0,.8)}
.big svg,.sm svg{width:100%;height:100%;display:block}
.name{font-weight:800;font-size:19px;text-align:center}
.why{color:#9aa2af;font-size:13.5px;line-height:1.4;text-align:center;min-height:56px}
.home{display:flex;gap:10px;align-items:flex-start;justify-content:center;background:linear-gradient(160deg,#3b4a6b,#1b2236);border-radius:16px;padding:12px 10px 8px;width:100%;box-sizing:border-box}
.app{display:grid;justify-items:center;gap:4px;width:56px}
.sm{width:52px;height:52px;border-radius:12px;overflow:hidden}
.app span{font-size:9.5px;color:#fff;white-space:nowrap}
.ph{width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,.18)}
.tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:#1a1408;background:#e8c170;border-radius:6px;padding:2px 7px}
</style></head><body><div class="page">
<h1>Spot-a-Crop · icon ideas</h1>
<p class="sub">All original artwork (no emoji). Big = App Store. Small = how it looks on a home screen.</p>
<div class="grid" id="grid"></div>
</div>
<script>
// ---------- the five concepts, as 100×100 SVGs ----------
const rows = (cols, y0 = 52) => cols.map((c, i) => `<path d="M${-20 + i * 26} 100 L${18 + i * 14} ${y0} L${32 + i * 14} ${y0} L${6 + i * 26} 100 Z" fill="${c}"/>`).join('');
const sky = (a, b) => `<defs><linearGradient id="s${a.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100" height="100" fill="url(#s${a.slice(1)})"/>`;

const A = `<svg viewBox="0 0 100 100">${sky('#1b2a3a', '#0f1420')}
  <circle cx="74" cy="22" r="9" fill="#ffd36b" opacity=".9"/>
  <path d="M0 58 Q50 50 100 58 L100 100 L0 100Z" fill="#2f8f4e"/>
  ${rows(['#ffc928', '#3fae5c', '#ffc928', '#3fae5c', '#ffc928'], 56)}
  <circle cx="44" cy="52" r="21" fill="#0f1420" opacity=".35"/>
  <clipPath id="lens"><circle cx="44" cy="52" r="18"/></clipPath>
  <g clip-path="url(#lens)"><rect x="20" y="30" width="50" height="50" fill="#bff0c8"/>
    <path d="M44 70 V52" stroke="#2f8f4e" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M44 56 C36 54 33 47 35 42 C41 43 44 48 44 56Z" fill="#3fae5c"/>
    <path d="M44 53 C51 50 55 44 53 38 C47 40 44 46 44 53Z" fill="#46c776"/></g>
  <circle cx="44" cy="52" r="18" fill="none" stroke="#e8c170" stroke-width="5.5"/>
  <path d="M57 65 L72 80" stroke="#e8c170" stroke-width="8" stroke-linecap="round"/>
  <path d="M57 65 L72 80" stroke="#c99a3e" stroke-width="3" stroke-linecap="round"/>
</svg>`;

const B = `<svg viewBox="0 0 100 100">${sky('#ffd98a', '#ffb45c')}
  <circle cx="80" cy="18" r="8" fill="#fff4cf"/>
  <!-- carrot -->
  <path d="M22 70 L30 34 L38 70Z" fill="#ff8a3d"/><path d="M27 48 h6 M26 56 h8" stroke="#e5712a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M30 34 C26 26 24 22 25 18 M30 34 C30 26 31 21 33 17 M30 34 C34 27 37 24 39 22" stroke="#3fae5c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="28" cy="44" r="1.5" fill="#2a1a0c"/><circle cx="32.5" cy="44" r="1.5" fill="#2a1a0c"/>
  <!-- tomato -->
  <circle cx="54" cy="56" r="16" fill="#ef4444"/><circle cx="48" cy="50" r="4" fill="#ff8080" opacity=".6"/>
  <path d="M54 40 l-6 -3 l5 6 l-4 4 l6 -3 l5 5 l-1 -6 l6 -2 l-6 -1 l1 -6 z" fill="#2f8f4e"/>
  <circle cx="49" cy="57" r="1.8" fill="#2a1a0c"/><circle cx="58" cy="57" r="1.8" fill="#2a1a0c"/>
  <path d="M50 62 Q53.5 65 57 62" stroke="#2a1a0c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- pea pod -->
  <path d="M68 70 C66 52 74 40 86 36 C88 50 82 64 68 70Z" fill="#6cc04a"/>
  <circle cx="74" cy="58" r="3.4" fill="#9be070"/><circle cx="78" cy="51" r="3.4" fill="#9be070"/><circle cx="82" cy="44" r="3" fill="#9be070"/>
  <circle cx="76" cy="57" r="1.2" fill="#2a1a0c"/><circle cx="80" cy="50" r="1.2" fill="#2a1a0c"/>
  <!-- field in front -->
  <path d="M0 66 Q50 58 100 66 L100 100 L0 100Z" fill="#3f9e55"/>
  <path d="M0 76 Q50 68 100 76" stroke="#348a48" stroke-width="3" fill="none"/><path d="M0 88 Q50 80 100 88" stroke="#348a48" stroke-width="3" fill="none"/>
</svg>`;

const C = `<svg viewBox="0 0 100 100">${sky('#24324a', '#121826')}
  <path d="M0 74 Q50 66 100 74 L100 100 L0 100Z" fill="#2f8f4e"/>
  ${rows(['#3fae5c', '#ffc928', '#3fae5c', '#ffc928', '#3fae5c'], 74)}
  <!-- Kernel -->
  <path d="M22 66 C14 54 18 38 26 32 C26 46 32 58 42 66 Z" fill="#3fbf6a"/>
  <path d="M78 66 C86 54 82 38 74 32 C74 46 68 58 58 66 Z" fill="#2ea85a"/>
  <ellipse cx="50" cy="52" rx="17" ry="26" fill="#ffc928"/>
  <g fill="#ffdd6b"><circle cx="43" cy="37" r="3"/><circle cx="50" cy="34" r="3"/><circle cx="57" cy="37" r="3"/><circle cx="42" cy="66" r="3"/><circle cx="58" cy="66" r="3"/></g>
  <!-- binoculars -->
  <rect x="34" y="42" width="13" height="14" rx="4" fill="#2b2f36"/><rect x="53" y="42" width="13" height="14" rx="4" fill="#2b2f36"/>
  <rect x="46" y="45" width="8" height="5" rx="2" fill="#2b2f36"/>
  <circle cx="40.5" cy="49" r="4.6" fill="#7fd3ff" stroke="#e8c170" stroke-width="1.6"/><circle cx="59.5" cy="49" r="4.6" fill="#7fd3ff" stroke="#e8c170" stroke-width="1.6"/>
  <circle cx="39" cy="47.5" r="1.4" fill="#fff"/><circle cx="58" cy="47.5" r="1.4" fill="#fff"/>
  <path d="M44 62 Q50 67 56 62" stroke="#1a1408" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M22 66 C28 78 40 84 50 84 C60 84 72 78 78 66 C68 72 58 74 50 74 C42 74 32 72 22 66Z" fill="#46c776"/>
</svg>`;

const D = `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#151a22"/>
  <g transform="rotate(-12 50 50)">
    <rect x="-10" y="-10" width="40" height="34" fill="#ffc928"/><rect x="30" y="-10" width="34" height="34" fill="#3fae5c"/><rect x="64" y="-10" width="46" height="34" fill="#a78bfa"/>
    <rect x="-10" y="24" width="28" height="38" fill="#3fae5c"/><rect x="18" y="24" width="44" height="38" fill="#fb7a24"/><rect x="62" y="24" width="48" height="38" fill="#ffc928"/>
    <rect x="-10" y="62" width="46" height="48" fill="#ffc928"/><rect x="36" y="62" width="30" height="48" fill="#38bdf8"/><rect x="66" y="62" width="44" height="48" fill="#3fae5c"/>
    <path d="M-10 24 H110 M-10 62 H110 M30 -10 V24 M64 -10 V24 M18 24 V62 M62 24 V62 M36 62 V110 M66 62 V110" stroke="#151a22" stroke-width="3"/>
  </g>
  <!-- pin -->
  <path d="M50 84 C50 84 30 60 30 44 A20 20 0 1 1 70 44 C70 60 50 84 50 84Z" fill="#151a22" opacity=".35" transform="translate(2 3)"/>
  <path d="M50 82 C50 82 31 59 31 44 A19 19 0 1 1 69 44 C69 59 50 82 50 82Z" fill="#e8c170"/>
  <circle cx="50" cy="44" r="11" fill="#fff8e6"/>
  <path d="M50 52 V44" stroke="#2f8f4e" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M50 46 C45 45 43 40 44 37 C48 38 50 41 50 46Z" fill="#3fae5c"/><path d="M50 44 C55 42 57 38 56 34 C52 35 50 39 50 44Z" fill="#46c776"/>
</svg>`;

const E = `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#14181f"/>
  <g transform="rotate(8 50 50)">
    <rect x="-10" y="-10" width="38" height="40" fill="#5c6b3e"/><rect x="28" y="-10" width="40" height="40" fill="#7a6a3a"/><rect x="68" y="-10" width="42" height="40" fill="#4c6b4a"/>
    <rect x="-10" y="30" width="30" height="40" fill="#7a6a3a"/><rect x="20" y="30" width="52" height="40" fill="#ffc928"/><rect x="72" y="30" width="38" height="40" fill="#5c6b3e"/>
    <rect x="-10" y="70" width="50" height="40" fill="#4c6b4a"/><rect x="40" y="70" width="30" height="40" fill="#6b5c38"/><rect x="70" y="70" width="40" height="40" fill="#7a6a3a"/>
    <path d="M-10 30 H110 M-10 70 H110 M28 -10 V30 M68 -10 V30 M20 30 V70 M72 30 V70 M40 70 V110 M70 70 V110" stroke="#14181f" stroke-width="3"/>
    <g stroke="#e0a91a" stroke-width="2.2" opacity=".55"><path d="M26 34 V66 M34 34 V66 M42 34 V66 M50 34 V66 M58 34 V66 M66 34 V66"/></g>
  </g>
  <circle cx="50" cy="50" r="27" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="50" cy="50" r="27" fill="none" stroke="#e8c170" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M50 17 V27 M50 73 V83 M17 50 H27 M73 50 H83" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</svg>`;

const ideas = [
  ['A', 'Spy Glass', A, 'A magnifying glass spotting a sprout in the rows. “Spot” is the hero, no single crop.', 'my pick'],
  ['B', 'Crop Crew', B, 'Carrot, tomato and pea pod peeking over a field. Fruit-and-veg forward, very friendly.', ''],
  ['C', 'Kernel Scout', C, 'Kernel with binoculars, spotting. Keeps the mascot you already have.', ''],
  ['D', 'Crop Pin', D, 'A map pin with a sprout over colorful fields. Says “map app” instantly.', ''],
  ['E', 'Target Field', E, 'Aerial patchwork with one field in the crosshairs. The most grown-up and minimal.', ''],
];
document.getElementById('grid').innerHTML = ideas.map(([k, name, svg, why, tag]) => `<div class="c">
  <div class="big">${svg}</div>
  <div class="name">${k}. ${name}</div>${tag ? `<span class="tag">${tag.toUpperCase()}</span>` : '<span style="height:19px"></span>'}
  <div class="why">${why}</div>
  <div class="home"><div class="app"><div class="ph"></div><span>Maps</span></div><div class="app"><div class="sm">${svg}</div><span>Spot-a-Crop</span></div><div class="app"><div class="ph"></div><span>Weather</span></div></div>
</div>`).join('');
</script></body></html>
